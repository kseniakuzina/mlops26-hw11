apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-sim-config
  labels: {{- include "llm-sim.labels" . | nindent 4 }}
data:
  MODEL_DIR: /models
  MODEL_VERSION: {{ .Values.model.version | quote }}
  MODEL_SHA256: {{ .Values.model.sha256 | quote }}
  BACKEND_MODE: {{ .Values.backend.mode | quote }}
  WORK_MODE: {{ .Values.backend.workMode | quote }}
  WARMUP_SECONDS: {{ .Values.backend.warmupSeconds | quote }}
  MAX_CONCURRENCY: {{ .Values.backend.maxConcurrency | quote }}
  MAX_QUEUE: {{ .Values.backend.maxQueue | quote }}
  CHUNK_INTERVAL_MS: {{ .Values.backend.chunkIntervalMs | quote }}
  CPU_MS_PER_CHUNK: {{ .Values.backend.cpuMsPerChunk | quote }}
  PREFILL_MS_PER_KCHAR: {{ .Values.backend.prefillMsPerKchar | quote }}
  CACHE_HIT_MS: {{ .Values.backend.cacheHitMs | quote }}
  PREFIX_CACHE_ENTRIES: {{ .Values.backend.prefixCacheEntries | quote }}
  DEFAULT_MAX_CHUNKS: {{ .Values.backend.defaultMaxChunks | quote }}
  KEEPALIVE_SECONDS: {{ .Values.backend.keepAliveSeconds | quote }}
  GRACEFUL_SHUTDOWN_SECONDS: {{ .Values.termination.gracefulShutdownSeconds | quote }}
  FAULT_INJECTION: {{ ternary "1" "0" .Values.faultInjection | quote }}

{{- if .Values.router.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-router-config
  labels: {{- include "llm-sim.labels" . | nindent 4 }}
data:
  haproxy.cfg: |
    global
      log stdout format raw local0 info
    defaults
      mode http
      log global
      timeout connect 3s
      timeout client 130s
      timeout server 130s
      timeout http-keep-alive 5s
      # трасса: время, клиент, выбранный сервер, статус, полное время, Request ID и Session ID
      log-format "%t client=%ci server=%s status=%ST total_ms=%Ta hdrs=%hr"
    resolvers k8s
      parse-resolv-conf
      resolve_retries 3
      timeout resolve 1s
      timeout retry 1s
      hold valid 2s
      hold other 2s
      hold refused 2s
      hold nx 2s
      hold timeout 2s
      hold obsolete 2s
    frontend fe
      bind :8080
      http-request capture req.hdr(X-Request-ID) len 40
      http-request capture req.hdr(X-Session-ID) len 32
      default_backend sim
    frontend stats
      bind :8405
      http-request use-service prometheus-exporter if { path /metrics }
    backend sim
      # Готовая политика: consistent hashing по сессии с ограничением загрузки (bounded loads).
      # Диалог остаётся на «своей» реплике (локальность префиксного кеша), пока её загрузка
      # не превышает {{ .Values.router.balanceFactor }} % средней; иначе запрос уходит на следующую по кольцу.
      balance hdr(X-Session-ID)
      hash-type consistent
      hash-balance-factor {{ .Values.router.balanceFactor }}
      option httpchk GET /readyz
      http-check expect status 200
      default-server inter 1s fall 1 rise 1 check resolvers k8s init-addr none
      server-template sim {{ .Values.router.serverSlots }} llm-sim-headless.{{ .Release.Namespace }}.svc.cluster.local:8000
      http-response set-header X-Routed-To %[srv_name]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router
  labels: {{- include "llm-sim.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: llm-router}
  template:
    metadata:
      labels: {app: llm-router}
      annotations:
        checksum/config: {{ .Values.router | toJson | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8405"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: haproxy
          image: {{ .Values.router.image }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 8405}
          volumeMounts:
            - {name: cfg, mountPath: /usr/local/etc/haproxy}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 32Mi}
            limits: {cpu: "1", memory: 128Mi}
      volumes:
        - name: cfg
          configMap: {name: llm-router-config}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-router
  labels: {{- include "llm-sim.labels" . | nindent 4 }}
spec:
  selector: {app: llm-router}
  ports:
    - {name: http, port: 80, targetPort: http}
{{- end }}
